# Enumerations
enum ResourceType {
  person
  content
  historicalFigure
  ministry
  topic
  question
  placeholder
}
enum CategoryType {
  card
  list
}
enum PageType {
  dashboard
  apologetics
  theology
  commentary
  topic
  glossary
  about
  notFound
  add
  bibleBook
}
enum APIPlatform {
  youtube
}

# Inputs
input ResourceAPIInput {
  platform: APIPlatform!
  queryParam: String!
}
input ResourceInput {
  _id: ID!
  name: String!
  creator: String
  color: String
  type: ResourceType!
  shortDesc: String
  longDesc: String
  badges: [String!]!
  tags: [String!]!
  api: ResourceAPIInput
}

type Text {
  value: String
}

type ResourceRowContent {
  content: [Resource!]!
}
type StringRowContent {
  content: [String!]!
}
union RowContent = ResourceRowContent | StringRowContent
type Row {
  _id: String!
  name: String
  type: CategoryType
  content: RowContent!
}

type Category {
  _id: String!
  pretty: String!
  description: String
  type: CategoryType
}

type ResourceLink {
  _id: ID!
  platform: String!
  link: String!
  displayText: String!
  icon: String
  priority: Boolean
}

type Content {
  _id: ID!
  title: String!
  desc: String
  thumbnail: String!
  badges: [String]
  link: String!
}

type SidebarItem {
  _id: String!
  title: String!
  icon: String!
  content: [ResourceLink!]!
}

type Page {
  _id: String!
  title: String!
  color: String
  rows: [Row]!
  pageType: PageType!
  shortDesc: String
  longDesc: String
  sidebarItems: [SidebarItem]
  needsHelp: Boolean
  related: [String]
  sub: [String]
}

type ResourceAPI {
  platform: APIPlatform!
  queryParam: String!
}

type Resource {
  _id: ID!
  name: String!
  creator: String
  color: String
  type: ResourceType!
  shortDesc: String
  longDesc: String
  badges: [String!]!
  tags: [String!]!
  api: ResourceAPI
}

# Glossary Page
type GlossaryItem {
  _id: String!
  pretty: String!
  type: String
}
type GlossarySection {
  letter: String!
  content: [GlossaryItem!]!
}
type GlossaryData {
  resources: [GlossarySection!]!
  topics: [GlossarySection!]!
}
type GlossaryPage {
  _id: String!
  data: GlossaryData!
}

# Query Type
type Query {
  getAllResources: [Resource]
  getResourceById(id: String!): Resource
  getDashboard: Page
  getTheology: Page
  getCommentary: Page
  getGlossary: GlossaryPage
  search: ResourceLink
  getTopic(topicId: ID!): Page
  findCategoryById: Category
  getCategoriesByPageAndType(
    pageId: String!
    categoryType: CategoryType
  ): [Category]
}

# Mutation Type
type Mutation {
  addResource(resource: ResourceInput!): Resource
}
